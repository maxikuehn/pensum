# Baut Pensum bei jedem Push auf main und testet die Rechenlogik.
# Ein Release entsteht nur, wenn es für die Version in Xcode (MARKETING_VERSION) noch keinen Tag gibt:
# Version erhöhen, pushen, fertig. Ohne neue Version bleibt der Build als Artefakt am Lauf hängen.
name: Build und Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version bestimmen
        id: version
        run: |
          version=$(grep -m1 'MARKETING_VERSION = ' Pensum.xcodeproj/project.pbxproj | sed -E 's/.*= ([^;]+);.*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Version $version ist schon veröffentlicht, es wird nur gebaut."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Neue Version $version, es wird ein Release angelegt."
          fi
          xcodebuild -version

      - name: Rechenlogik testen
        working-directory: PensumCore
        run: swift test

      - name: App bauen
        run: |
          xcodebuild -project Pensum.xcodeproj -scheme Pensum -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build

      - name: Verpacken
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Release/Pensum.app "Pensum-${{ steps.version.outputs.version }}.zip"

      # Disk-Image mit der App links und dem Programme-Ordner rechts zum Hineinziehen,
      # Hintergrund aus scripts/make-dmg-background.swift.
      # Gelingt das Finder-Layout auf dem Runner nicht, entsteht es ohne Layout.
      - name: Disk-Image erstellen
        run: |
          app=build/Build/Products/Release/Pensum.app
          dmg="Pensum-${{ steps.version.outputs.version }}.dmg"
          mkdir dmg && cp -R "$app" dmg/
          brew install --quiet create-dmg
          if ! create-dmg \
              --volname "Pensum" \
              --volicon "$app/Contents/Resources/AppIcon.icns" \
              --background scripts/dmg/background.tiff \
              --window-pos 200 120 \
              --window-size 540 372 \
              --icon-size 128 \
              --text-size 13 \
              --icon "Pensum.app" 140 140 \
              --hide-extension "Pensum.app" \
              --app-drop-link 400 140 \
              "$dmg" dmg/; then
            echo "::warning::Finder-Layout nicht möglich, Disk-Image ohne Layout"
            rm -f "$dmg"
            ln -s /Applications dmg/Applications
            hdiutil create -volname Pensum -srcfolder dmg -ov -format UDZO "$dmg"
          fi

      - name: Release anlegen
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            "Pensum-${{ steps.version.outputs.version }}.dmg" \
            "Pensum-${{ steps.version.outputs.version }}.zip" \
            --title "Pensum ${{ steps.version.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --generate-notes

      - name: Build als Artefakt ablegen
        if: steps.version.outputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Pensum-${{ steps.version.outputs.version }}-build-${{ github.run_number }}
          path: |
            Pensum-${{ steps.version.outputs.version }}.dmg
            Pensum-${{ steps.version.outputs.version }}.zip
          retention-days: 14
